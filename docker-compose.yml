services:
  text2speech:
    build: .
    image: dev-text2speech:cpu
    ports: ["${API_PORT:-7101}:7101"]
    environment:
      API_KEY: ${API_KEY:-}
      TTS_MODEL: ${TTS_MODEL:-collabora/whisperspeech:s2a-q4-tiny-en+pl.model}
      MAX_TEXT_CHARS: ${MAX_TEXT_CHARS:-5000}
    volumes:
      - ${MODEL_CACHE_PATH:-tts-cache}:/cache
  text2speech-nvidia:
    profiles: ["nvidia"]
    build:
      context: .
      dockerfile: docker/Dockerfile.cuda
    image: dev-text2speech:nvidia
    ports: ["${API_PORT:-7101}:7101"]
    environment:
      API_KEY: ${API_KEY:-}
      TTS_MODEL: ${TTS_MODEL:-collabora/whisperspeech:s2a-q4-tiny-en+pl.model}
    volumes:
      - ${MODEL_CACHE_PATH:-tts-cache}:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  tts-cache:
